; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[platformio]
default_envs = esp32dev

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  ricmoo/QRCode@^0.0.1

; Standard ESP32 Dev Board (e.g. WROOM-32)
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 230400

board_build.embed_files = data/ui_font.vlw

build_flags =
  -DWM_NODEBUG
  -DWM_MDNS
  -DDISPLAY_PIN_RST=4
  -DDISPLAY_PIN_CS=5
  -DDISPLAY_PIN_DC=2
  -DDISPLAY_PIN_MOSI=23
  -DDISPLAY_PIN_SCLK=18
  -DBOOT_PIN=0

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  ricmoo/QRCode@^0.0.1



; ESP32-S3 Dev Board
[env:esp32s3]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.embed_files = data/ui_font.vlw

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS
  -DDISPLAY_PIN_RST=4
  -DDISPLAY_PIN_CS=5
  -DDISPLAY_PIN_DC=6
  -DDISPLAY_PIN_MOSI=7
  -DDISPLAY_PIN_SCLK=15
  -DBOOT_PIN=0

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
  ricmoo/QRCode@^0.0.1
